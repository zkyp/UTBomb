[UTBomb.BombClassDefs]
; EXAMPLE: the standard class set WITH skins.
; The seven skin packs named below are community packs that are NOT part of this
; repository. Get them from their authors, put them on the server and list them in
; ServerPackages (see docs/SKINS.md). To use this file, copy it to the System
; folder as UTBombClasses.ini.
;
; =============================================================================
;  UTBombClasses.ini  -  the CLASSES of the Bomb Defusal game type
; =============================================================================
;  Only the classes live in this file. All other settings (round times, bomb,
;  warm-up, passwords ...) are in UTBomb.ini.
;
;  WHERE IT GOES
;    In the System folder of the machine that RUNS the match: the Linux server
;    for online play, your own PC for matches you host yourself. Players do not
;    need it, the server sends them the class list.
;
;  HOW TO USE IT
;    Edit with the server stopped (or restart it afterwards). No recompiling.
;    The game never rewrites this file, so the comments you see here stay.
;    A line with a mistake is skipped and a warning is written to the log.
;    Up to 15 classes: ClassDef[0] to ClassDef[14]. An empty line = no class.
;    ClassDef[15] is not used (the number is kept for the super class, below).
;    The classes are listed in the menu in this order.
; =============================================================================
;
;  A CLASS LINE
;    ClassDef[n]=Name | Armor=<n> | T1=Weapon:Ammo | T2=Weapon:Ammo,Weapon:Ammo | T3=... | Wild=<wildcard> | more options
;
;  Everything is separated by the | sign. The order after the name does not matter.
;
;  NAME     The name shown in the menu.
;  ARMOR    Armor=0 none, 1-50 Thigh Pads, 51-100 Body Armor, 101-150 both,
;           151-300 a bigger body armor plus full Thigh Pads (200 = 150 + 50).
;           Armor soaks only part of each hit (body armor 75%, pads 50%), the rest
;           still drains health. As a rule of thumb one point of armor is worth
;           about one hit point, as long as enough health is left underneath.
;           Around 200 armor works with 100 health, much more needs more Health.
;  HEALTH   Optional. Starting health, 50 to 400, default 100. The Keg adds to it.
;           Regeneration stops at this value. A class with Health=70 heals back
;           to 70 and no further.
;
;  WEAPONS, IN THREE TIERS
;    T1=Shock:24             Tier 1: normally ONE weapon, fixed to the class. By
;                            convention the Shock or the Sniper, but a class may
;                            leave it out. (The super class has two to choose from.)
;    T2=Rocket:18,Flak:20    Tier 2: up to 4 choices, the FIRST is the default.
;                            By convention Rocket, Flak, Pulse or Minigun.
;    T3=Ripper:30,Bio:20     Tier 3: up to 4 choices, the first is the default.
;                            By convention Ripper, Bio or Enforcer.
;    Players change their tier 2 and tier 3 weapon in the class menu (the two
;    buttons below the class cards) or with the commands "mutate t2 flak" and
;    "mutate t3 bio". The weapon ammo is written after the name, each choice has
;    its own number. Leave the ammo out (or 0) for the weapon's normal ammo.
;    The tiers are only slots: nothing stops you putting any weapon in any tier.
;    The Minigun and the Enforcer SHARE their ammo in UT99, so a player can never
;    have both: the game refuses that combination.
;    Tier 1 can have choices too, the same way: T1=Sniper:8,Shock:14.
;    Plain weapons still work: ClassDef[n]=Name | Armor=50 | Shock:24 | Rocket:24
;    makes the first weapon tier 1 and the second tier 2, each with no choice.
;
;  WILD      The class's wildcard. Fixed, players cannot change it. A class can have
;            SEVERAL, separated by a comma: Wild=NoSelfDamage,Translocator:5
;            Careful: in the weapon lines (T1, T2, T3) a comma means 'choose ONE of
;            these', but in Wild= it means 'ALL of these at once'.
;              Translocator       the Translocator, unlimited uses
;              Translocator:5     the Translocator with 5 uses per round (like ammo)
;              AmmoPack           extra ammo for ONE tier (see PackSlot)
;              Keg                extra health
;              DefuseKit          defuse the bomb faster (defenders only; an attacker
;                                 with this wildcard gets the Translocator instead)
;              NoSelfDamage       takes no damage from its own weapons
;              NoTeamDamage       never hurts teammates (rockets and hammer hits can
;                                 launch allies without hurting them). Also called
;                                 Booster.
;              None               nothing
;
;  OPTIONAL VALUES (leave out what you do not need, the default is used)
;    PackSlot=<1-3>        Which TIER the Ammo Pack boosts. Default 1 (or the first
;                          tier the class has).
;    Speed=<percent>       Movement speed, 100 = normal. 30 to 250. Changes smaller
;                          than about 20 percent are hard to feel, so use clear
;                          steps: 130 is a fast class, 70 a slow one. Leave it out
;                          for normal speed.
;    Regen=<hp per second> Health regained per second, 0 to 50. Starts a few
;                          seconds after the last damage (RegenDelay is in
;                          UTBomb.ini) and stops at the class's own Health.
;    SelfDamage=<percent>  How much of the damage a player does to THEMSELVES they
;                          take. 100 = normal, 0 = none (rocket jumps, explosions,
;                          the Impact Hammer jump). The push of the blast stays.
;    HammerSelfDamage=<percent>  The same, for the Impact Hammer only.
;    WallDodge=<0 or 1>    IG+ servers only. 1 = the class can wall dodge: dodge in
;                          the air off a wall. It is the on/off switch.
;                          Leave out = the server's IG+ setting.
;    Dodges=<n>            IG+ servers only. HOW MANY wall dodges the class can chain
;                          after its first dodge, 0 to 10. Dodges=1 = one kick off
;                          a wall, Dodges=2 = two kicks, for example off two walls
;                          in a row. Needs WallDodge=1. Leave out = the server's
;                          IG+ setting.
;    Amp=<0 or 1>          1 = the class starts with the Damage Amplifier, activated.
;                          It wears off by itself after its normal time.
;    Model=<body>          The body of the class: Commando, Soldier, FCommando (female
;                          commando), FSoldier or Boss. It must be the body the skin
;                          was made for. Needs Skin=.
;    Skin=<Package.name>   The skin: the package and the name WITHOUT the number at the
;                          end, e.g. Soldierskins_SnyperX.snyx for the textures snyx1,
;                          snyx2 ... The red and blue team version is picked by the game.
;    Face=<Package.Face>   The face, e.g. Soldierskins_SnyperX.Fate (the texture is
;                          snyx4Fate). Optional.
;    Portrait=<Package.Texture>  The picture of the class in the bar at the top of the
;                          screen. Normally made from Skin and Face (the texture base5Face,
;                          like snyx5Fate). Only needed when a pack has no such picture.
;                          A class without Model/Skin keeps the player's own skin.
;                          The package must be on the server and in its ServerPackages.
;                          A wrong name is reported in the server log, and gives the
;                          player the plain default look.
;    Icon=<Package.Texture>  Your own picture for the class card in the menu, drawn
;                          about 120x40. The texture package has to be in the
;                          server's ServerPackages. Without it the weapon icons of
;                          the default weapons are shown.
;
;  WEAPON NAMES (write the short name on the left)
;    Sniper       Botpack.SniperRifle        Shock    Botpack.ShockRifle
;    Rocket       Botpack.UT_Eightball       Flak     Botpack.UT_FlakCannon
;    Minigun      Botpack.minigun2           Pulse    Botpack.PulseGun
;    Ripper       Botpack.Ripper             Bio      Botpack.UT_BioRifle
;    Enforcer     Botpack.Enforcer           ImpactHammer  Botpack.ImpactHammer
;    Weapons from other mods: the full name, for example MyPackage.MyWeapon.
;    Everyone also gets the Impact Hammer as a melee weapon (switch in UTBomb.ini).
; =============================================================================
;
;  WEAPON GUIDE  (how strong each weapon is and where it works. Written by the
;  designer of the mode. Keep it in mind when building or changing classes.)
;
;    STRENGTH      TOP:    Shock, Sniper
;                  STRONG: Rocket, Flak, Pulse, Minigun
;                  WEAK:   Ripper, Bio, Enforcer
;
;    Sniper    Very strong at long AND mid range, and strong enough to use close
;              up too. A headshot does 150 damage (already reduced in IG+ because
;              it was too strong).
;    Shock     Probably the strongest weapon: hitscan, good at mid and long range,
;              and the combo makes it a kind of spam weapon as well.
;    Rocket    Strong spam, but useless at long and mid range. Good close up,
;              especially with the six-pack and pre-spamming.
;    Flak      Same strength as the Rocket. A strong primary, but only close up,
;              plus the flak ball as a projectile.
;    Minigun   Strong, about the level of the Pulse. Can shoot long range.
;    Pulse     Strong at close range (hits harder than the Minigun), cannot
;              really reach long range.
;    Ripper    Weak spam weapon.
;    Bio       Very weak, but a full blob kills instantly. About the level of the
;              Ripper.
;    Enforcer  Weak. Useless close up, but does damage at mid and long range.
;              Keep the ammo LOW. It shares its ammo with the Minigun.
;
;    Close range: Rocket, Flak, Pulse (weak: Ripper, Bio).
;    Mid and long range: Sniper, Shock, Minigun (long), Enforcer (weak).
; =============================================================================
;
;  HOW THE CLASSES BELOW WERE DESIGNED (keep these rules when you add classes)
;    Every class trades three things: MOBILITY, TOUGHNESS and FIREPOWER.
;      Mobility tools: Speed 130, a Translocator (every use counts), wall
;                      dodging / extra dodges, and free self-damage jumps
;                      (NoSelfDamage, rocket and hammer jumps).
;      Toughness:      Armor, the Keg wildcard, Health, Regen.
;      Firepower:      the weapons and how much ammo they come with.
;    1. A class has AT MOST TWO mobility tools. Most have one or none.
;    2. Every mobility tool is paid for in toughness or firepower. Fast classes
;       have Armor 50 or less. The slowest class has the most armor.
;    3. Armor 150 or more means a SLOW class (Speed 70) or one with no mobility
;       tool.
;    4. Speed is only ever 130, 70 or normal (leave it out).
;    5. A Translocator is worth carrying only with enough uses: 5 or more.
;       A plain "Wild=Translocator" is unlimited, so always write a number.
;    6. The strong weapon is part of the class: Tier 1 (Shock or Sniper) is fixed.
;       Classes that have no Shock or Sniper are balanced by Armor or Health.
;       The choices in tier 2 and tier 3 are weapons that suit the class.
;    7. Only one class offers the Enforcer.
;    8. Keep ammo inside the stock maximum of the weapon (Minigun 199, most others
;       50) so the numbers mean what they say. (The mod would allow more.)
;  THE STANDARD CLASS SET (written by the designer of the mode)
;    Default    The all-rounder. Class 0, so it is what players get if they never
;               open the menu.
;    HammerKing Jumps with the Impact Hammer (free, no self damage). His only tier 2
;               weapon is the Flak: with a Rocket he could rocket jump as well,
;               which would be too much.
;    SniperNoob Sniper plus a weak tier 3 weapon. No tier 2: the Sniper is strong
;               enough close up.
;    FastGirl   The fast, fragile one: speed 130 and two wall dodges.
;    Spammer    The tank with the Ammo Pack on tier 2, and no Shock or Sniper.
;    Booster    Rocket as tier 2 and no tier 3: with no team damage she launches
;               teammates. Less Health (70) instead of less armor, because she
;               regenerates.
;    Fatboy     Armor 200, the Keg, Shock 50 and speed 70.
; =============================================================================

ClassDef[0]=Default  | Armor=100 | T1=Shock:24 | T2=Rocket:18,Flak:20,Pulse:50 | Wild=Translocator:5
ClassDef[1]=HammerKing   | Armor=75  | T1=Shock:12 | T2=Flak:24 | Wild=NoSelfDamage | Model=Commando | Skin=CommandoSkins_AB.auss | Face=CommandoSkins_AB.Dicko
ClassDef[2]=SniperNoob | Armor=50  | T1=Sniper:16 | T3=Ripper:30,Bio:20 | Wild=Translocator:6 | Model=Soldier | Skin=Soldierskins_SnyperX.snyx | Face=Soldierskins_SnyperX.Fate
ClassDef[3]=FastGirl | Armor=50  | T2=Flak:12 | T3=Ripper:30,Enforcer:40,Bio:20 | Wild=None | Speed=130 | WallDodge=1 | Dodges=2 | Model=FCommando | Skin=FCommandoSkinsAsiaAlt.asia | Face=FCommandoSkinsAsiaAlt.Black
ClassDef[4]=Spammer  | Armor=150 | T2=Flak:30,Pulse:60,Rocket:18 | T3=Ripper:40,Bio:30 | Wild=AmmoPack | PackSlot=2 | Model=Soldier | Skin=SoldierSkins_Ork.OrrK | Face=SoldierSkins_Ork.Charok
ClassDef[5]=Booster   | Armor=125 | Health=70 | T1=Shock:20 | T2=Rocket:18 | Wild=NoTeamDamage | Regen=3 | Model=Commando | Skin=commandoskins_dcu.dcub | Face=commandoskins_dcu.Max
ClassDef[6]=Fatboy    | Armor=200 | T1=Shock:50 | T2=Minigun:199,Rocket:18,Flak:24 | Wild=Keg | Speed=70 | Model=Boss | Skin=BossSkins_keep.keep|Face=BossSkins_keep.keep|Portrait=BossSkins_keep.keep5xan

; =============================================================================
;  THE SUPER CLASS
;    A team that loses SuperLossStreak rounds in a row (5, set in UTBomb.ini, 0 =
;    off) gets the super class for ONE random player of that team in the next
;    round. It is assigned, nobody can pick it, and the player cannot change class
;    during that round. Afterwards they get their own class back and the team's
;    streak starts again from zero. The player still chooses their weapons from the
;    lists below, in the class menu or with "mutate t1/t2/t3".
;    The line is written like a class line. It does not show in the menu.
;    The ammo of the rocket, flak, minigun and pulse below is a first guess.
;    The amplifier lasts its normal time (about 30 seconds) so that it keeps its
;    purple glow. Slow (80), no self damage, and 5 translocations.
; =============================================================================
SuperDef=SUPER|Armor=150|Health=125|Amp=1|Speed=80|T1=Sniper:8,Shock:14|T2=Rocket:24,Flak:30|T3=Minigun:199,Pulse:60|Wild=NoSelfDamage,Translocator:5|Model=Soldier|Skin=SoldierSkins_SuperRobot.sppr|Face=SoldierSkins_SuperRobot.ned

; =============================================================================
;  SKINS: which pack each class uses
;    Default: the player's own skin            HammerKing: CommandoSkins_AB (male commando)
;    SniperNoob: Soldierskins_SnyperX          FastGirl: FCommandoSkinsAsiaAlt (female commando)
;    Spammer: SoldierSkins_Ork                 Booster: commandoskins_dcu (male commando)
;    Fatboy: BossSkins_keep (boss)             SUPER: SoldierSkins_SuperRobot
;    Write the package names exactly like the file names on the SERVER (Linux cares
;    about upper and lower case).
; =============================================================================

; =============================================================================
;  EXTRA CLASSES TO TRY. To use one, copy it to a free number (7 to 14) without
;  the ; at the start.
; =============================================================================
; ClassDef[7]=Sapper     | Armor=50  | T1=Shock:16 | T2=Flak:24,Pulse:40 | Wild=DefuseKit
; ClassDef[9]=Tank       | Armor=150 | Health=150 | T2=Minigun:199,Flak:30 | Wild=None | Speed=70
